<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.side{width:250px;background:var(--navy);color:#fff;padding:27px 17px;position:fixed;inset:0 auto 0 0;z-index:3;height:100vh;display:flex;flex-direction:column;overflow:hidden}.brand{padding:0 13px 25px;border-bottom:1px solid rgba(255,255,255,.13)}.brand h1{font:600 23px Georgia,serif;letter-spacing:2px;margin:0}.brand p{font-size:10px;letter-spacing:1.6px;color:#cbd4df;margin:8px 0 0}.nav{margin-top:18px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}.nav button{width:100%;border:0;background:none;color:#d8e0e8;text-align:left;padding:13px 13px;border-radius:8px;margin:2px 0;font-size:16px;line-height:1.35;display:block}.nav button.active,.nav button:hover{background:rgba(255,255,255,.1);color:#fff}.nav .sectionlabel{font-size:9px;letter-spacing:1.5px;color:#8494a6;padding:18px 13px 5px;text-transform:uppercase}.sidefoot{position:static;flex:0 0 auto;margin:8px 5px 0;font-size:12px;color:#9eabb9;line-height:1.5;padding-top:14px;border-top:1px solid rgba(255,255,255,.13)}.main{margin-left:250px;width:calc(100% - 250px);padding:32px 42px 55px}.view{display:none}.view.activeView{display:block}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:800}.title{font:600 31px Georgia,serif;margin:4px 0}.subtitle{font-size:15px;color:var(--muted);line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px}.btn:hover{border-color:#c8c0b1}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.small{font-size:11px;padding:7px 10px}.btn.danger{color:var(--red)}.btn.ghost{background:transparent}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px}.stat .num{font-size:28px;font-weight:650;margin-top:7px}.stat .small{font-size:12px;color:var(--muted);margin-top:4px}.section{margin-top:23px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section h2{font:600 20px Georgia,serif;margin:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.sankalpCard{position:relative}.topline{display:flex;justify-content:space-between;gap:14px}.sankalpCard h3{font:600 18px Georgia,serif;margin:0 0 4px}.meta{font-size:13px;color:var(--muted)}.pct{font-size:24px;font-weight:650}.progress{height:7px;background:#ece8df;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--navy2);border-radius:10px}.bar{margin:16px 0 11px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fact{background:#f3f0e8;padding:9px;border-radius:7px}.fact b{display:block;font-size:14px}.fact span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}.active{background:#e7f1eb;color:var(--green)}.paused{background:#f2eee3;color:var(--amber)}.completed{background:#e8edf3;color:var(--navy2)}.discontinued{background:#f5e8e8;color:var(--red)}.expired{background:#eee8e3;color:#785f52}.ontrack{color:var(--green)}.attention{color:var(--amber)}.behind{color:var(--red)}.neutral{color:var(--blue)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.rowtitle{font-weight:650}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px}.empty{text-align:center;padding:42px 18px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:6px}.notice{padding:14px 16px;border-left:3px solid var(--accent);background:#f3eee5;font-size:13px;color:#5e584f;line-height:1.55;margin-bottom:15px}.detailHero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.detailHero h2{font:600 27px Georgia,serif;margin:2px 0 5px}.bigpct{font-size:38px;font-weight:650}.detailGrid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.metricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#f4f1e9;border-radius:8px;padding:11px}.metric .v{font-size:19px;font-weight:650}.metric .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;color:var(--ink);outline:none}.field textarea{min-height:78px;resize:vertical}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(8,18,30,.56);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:var(--card);width:min(720px,100%);max-height:91vh;overflow:auto;border-radius:14px;padding:24px;box-shadow:0 25px 90px rgba(0,0,0,.28)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font:600 22px Georgia,serif;margin:0}.x{border:0;background:none;color:var(--muted);font-size:24px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:10px;color:var(--muted);padding:5px}.day{min-height:73px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px;font-size:10px}.day strong{display:block}.day .m{margin-top:8px;color:var(--green);font-weight:800}.day .dot{font-size:10px;color:var(--muted);margin-top:3px}.milestone{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.milestone:last-child{border-bottom:0}.milestone.done{color:var(--green)}.timeline{border-left:2px solid var(--line);padding-left:16px}.event{position:relative;margin:0 0 17px}.event:before{content:"";position:absolute;left:-22px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}.event b{font-size:12px}.event div{font-size:11px;color:var(--muted);margin-top:3px}.split{display:flex;justify-content:space-between;gap:10px;align-items:center}.whatif{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.whatif .field{min-width:170px}.result{background:#eef2f5;border-radius:8px;padding:10px;font-size:11px}.yearGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.yearBox{padding:13px;background:#f4f1e9;border-radius:9px}.yearBox b{font:600 18px Georgia,serif}.yearBox span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.searchResult{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.searchResult:hover{background:#faf8f3}.lock{position:fixed;inset:0;background:var(--navy);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.lock.show{display:flex}.lockbox{width:min(420px,100%);background:#fffdf9;border-radius:14px;padding:32px;text-align:center}.lockbox h2{font:600 24px Georgia,serif;margin:0 0 6px}.lockbox p{color:var(--muted);font-size:14px}.lockbox input{width:100%;padding:13px;font-size:16px;border:1px solid var(--line);border-radius:8px;margin:10px 0}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:11px 14px;border-radius:8px;font-size:11px;display:none;z-index:60}.toast.show{display:block}
@media(max-width:1000px){.side{width:220px}.main{margin-left:220px;width:calc(100% - 220px);padding:25px}.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.detailGrid{grid-template-columns:1fr}.yearGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.app{display:block}.side{position:static;width:100%;height:auto;min-height:auto;overflow:visible;display:block}.nav{max-height:none;overflow:visible}.sidefoot{display:none}.main{margin:0;width:100%;padding:18px}.grid,.grid3,.formgrid,.metricGrid,.yearGrid{grid-template-columns:1fr}.top,.detailHero{flex-direction:column}.calendar{gap:3px}.day{min-height:58px}.facts{grid-template-columns:repeat(2,1fr)}}

.cloudDot.ok{background:#39765a}.cloudDot.warn{background:#98753d}

<body>
<div class="app">
<aside class="side">
 <div class="brand"><h1>SĀDHANA OS</h1><p>SANKALP • JAPA • CONTINUITY</p></div>
 <nav class="nav">
  <button data-view="home" class="active">◈ Sankalp Library</button>
  <button data-view="today">◷ Today's Practice</button>
  <div class="sectionlabel">Practice</div>
  <button data-view="journal">◌ Japa Journal</button>
  <button data-view="calendar">□ Calendar</button>
  <div class="sectionlabel">History & Insight</div>
  <button data-view="archive">▱ Completed / Past</button>
  <button data-view="analytics">◫ Lifetime & Yearly</button>
  <button data-view="timeline">⌁ Activity Timeline</button>
  <div class="sectionlabel">System</div>
  <button data-view="search">⌕ Search</button>
  <button data-view="backup">↕ Backup & Data</button>
  <button data-view="settings">⚙ Settings</button>
  <button data-view="cloud">☁ Cloud Sync</button>
 </nav>
 <div class="sidefoot">Local-first. Your records stay on this device unless you export or sync them.</div>
</aside>
<main class="main">
 <div id="home" class="view activeView"></div><div id="today" class="view"></div><div id="journal" class="view"></div><div id="calendar" class="view"></div>
 <div id="archive" class="view"></div><div id="analytics" class="view"></div><div id="timeline" class="view"></div><div id="search" class="view"></div>
 <div id="backup" class="view"></div><div id="settings" class="view"></div><div id="cloud" class="view"></div><div id="detail" class="view"></div>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div><div class="modal" id="authModal"><div class="modalbox" id="authBox"></div></div>
<div class="lock" id="lock"><div class="lockbox"><h2>SĀDHANA OS</h2><p>This application is locked.</p><input id="pinInput" type="password" inputmode="numeric" placeholder="Enter PIN"><button class="btn primary" onclick="unlock()">Unlock</button><button class="btn danger" style="margin-top:8px" onclick="resetWithRecovery()">Forgot PIN?</button><div id="lockMsg" style="color:#9b4d4d;font-size:11px;margin-top:8px"></div></div></div>

<script>
const KEY='sadhana_os_v2', BACKUP_KEY='sadhana_os_snapshots', SETTINGS_KEY='sadhana_os_settings';
const defaults={sankalps:[],sessions:[],milestones:[],events:[]};
let data=loadData(); let settings=loadSettings(); let selectedId=null;
function loadData(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');return d&&Array.isArray(d.sankalps)?d:structuredClone(defaults)}catch{return structuredClone(defaults)}}
function loadSettings(){try{return Object.assign({lockEnabled:false,pin:'',recoveryKey:'',autoSnapshots:true},JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch{return {lockEnabled:false,pin:'',autoSnapshots:true}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));if(settings.autoSnapshots) snapshot();render()}
function snapshot(){let arr;try{arr=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]')}catch{arr=[]};arr.unshift({at:new Date().toISOString(),data:data});arr=arr.slice(0,5);localStorage.setItem(BACKUP_KEY,JSON.stringify(arr))}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function sessionsOf(s){return data.sessions.filter(x=>x.sankalpId===s.id)}
function total(s){return sessionsOf(s).reduce((a,x)=>a+Number(x.amount||0),0)}
function pct(s){return s.target>0?Math.min(100,total(s)/s.target*100):0}
function daysLeft(s){if(!s.deadline)return null;return Math.ceil((new Date(s.deadline)-new Date(today()))/86400000)}
function avgPerPracticeDay(s){let ss=sessionsOf(s);if(!ss.length)return 0;let days=new Set(ss.map(x=>x.date)).size;return total(s)/days}
function avgPerCalendarDay(s){let ss=sessionsOf(s);if(!ss.length)return 0;let start=new Date(s.start||ss[0].date), now=new Date(today());let days=Math.max(1,Math.floor((now-start)/86400000)+1);return total(s)/days}
function requiredPerDay(s){let rem=Math.max(0,s.target-total(s)),dl=daysLeft(s);return dl&&dl>0?rem/dl:0}
function projection(s,pace){let rem=Math.max(0,s.target-total(s));if(!rem||pace<=0)return null;let days=Math.ceil(rem/pace);let d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function health(s){if(s.status!=='active')return s.status==='completed'?'completed':'neutral';let rem=Math.max(0,s.target-total(s));if(rem<=0)return 'completed';let req=requiredPerDay(s),avg=avgPerCalendarDay(s);if(!s.deadline||req===0)return 'ontrack';if(avg>=req*1.05)return 'ontrack';if(avg>=req*.85)return 'attention';return 'behind'}
function healthLabel(s){let h=health(s);return {ontrack:'On Track',attention:'Needs Attention',behind:'Behind',completed:'Completed',neutral:'No Deadline'}[h]}
function statusPill(s){return `<span class="pill ${s.status}">${esc(s.status)}</span>`}
function logEvent(type,sId,text){data.events.unshift({id:uid(),at:new Date().toISOString(),type,sankalpId:sId||null,text})}
function createSnapshotNow(){snapshot();toast('Local recovery snapshot created')}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('activeView'));let el=document.getElementById(v);if(el)el.classList.add('activeView');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));selectedId=null;render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function header(ey,t,sub,actions=''){return `<div class="top"><div><div class="eyebrow">${ey}</div><div class="title">${t}</div><div class="subtitle">${sub}</div></div><div class="actions">${actions}</div></div>`}
function openModal(type,id=null){if(type==='sankalp')modalSankalp(id);if(type==='session')modalSession();if(type==='milestone')modalMilestone(id);if(type==='renew')renewModal(id);if(type==='whatif')whatIfModal(id)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};

function dateOrNull(v){return v===null||v===undefined||String(v).trim()===''?null:String(v)}
function dateOnly(v){
  if(!v)return null;
  const s=String(v).trim();
  return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null;
}
function normalizeForCloud(table,row){
  const x={...row};
  if(table==='sankalps'){
    x.start=dateOnly(x.start);
    x.deadline=dateOrNull(dateOnly(x.deadline));
  }
  if(table==='sessions') x.date=dateOnly(x.date);
  return x;
}
function validateCloudRows(rows){
  const problems=[];
  if(rows.sankalps.some(x=>!x.start))problems.push('One or more Sankalps have no valid Start Date.');
  if(rows.sessions.some(x=>!x.date))problems.push('One or more Japa sessions have no valid Date.');
  return problems;
}
function modalSankalp(id){
 let s=id?data.sankalps.find(x=>x.id===id):null;
 document.getElementById('modalbox').innerHTML=`<div class="modalhead"><h2>${s?'Edit Sankalp':'New Sankalp'}</h2><button class="x" onclick="closeModal()">×</button></div>
 <form id="sform"><div class="formgrid">
 <div class="field"><label>Sankalp Name *</label><input name="name" required value="${esc(s?.name)}"></div>
 <div class="field"><label>Sankalp Type *</label><select name="type">${['Deadline-based','Daily recurring','Target-based','Open-ended','Anushthan / Purashcharana','Custom'].map(x=>`<option ${s?.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Mantra *</label><input name="mantra" required value="${esc(s?.mantra)}"></div>
 <div class="field"><label>Devata / Deity</label><input name="deity" value="${esc(s?.deity)}"></div>
 <div class="field full"><label>Purpose / Intention</label><textarea name="purpose">${esc(s?.purpose)}</textarea></div>
 <div class="field"><label>Counting Method *</label><select name="unit">${['Mala','Repetition','Session','Minutes','Custom'].map(x=>`<option ${s?.unit===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Target *</label><input type="number" min="0" step="0.01" name="target" required value="${s?.target??''}"></div>
 <div class="field"><label>Repetitions per Mala</label><input type="number" min="1" step="1" name="reps" value="${s?.reps??108}"></div>
 <div class="field"><label>Daily Target (optional)</label><input type="number" min="0" step="0.01" name="dailyTarget" value="${s?.dailyTarget??''}"></div>
 <div class="field"><label>Start Date *</label><input type="date" name="start" required value="${s?.start||today()}"></div>
 <div class="field"><label>End / Target Date <span id="deadlineLabel">(optional)</span></label><input type="date" id="deadlineInput" name="deadline" value="${s?.deadline||''}" ${s?.type==='Open-ended'?'disabled':''}></div>
 <div class="field"><label>Status</label><select name="status">${['draft','active','paused','completed','discontinued','expired'].map(x=>`<option ${s?.status===x||(!s&&x==='active')?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Default Session</label><select name="session">${['Morning','Afternoon','Evening','Night','Other'].map(x=>`<option ${s?.defaultSession===x?'selected':''}>${x}</option>`).join('')}</select></div>
 </div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${s?'Save Changes':'Create Sankalp'}</button></div></form>`;
 document.getElementById('modal').classList.add('show');
 const typeEl=document.querySelector('#sform select[name="type"]');
 const deadlineEl=document.getElementById('deadlineInput');
 const deadlineLabel=document.getElementById('deadlineLabel');
 function syncDeadlineField(){
   const open=typeEl.value==='Open-ended';
   deadlineEl.disabled=open;
   if(open){deadlineEl.value='';deadlineLabel.textContent='(not required — open-ended)';}
   else deadlineLabel.textContent='(optional)';
 }
 typeEl.addEventListener('change',syncDeadlineField);
 syncDeadlineField();
 document.getElementById('sform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);
 let obj={id:s?.id||uid(),name:f.get('name'),type:f.get('type'),mantra:f.get('mantra'),deity:f.get('deity'),purpose:f.get('purpose'),unit:f.get('unit'),target:Number(f.get('target')),reps:Number(f.get('reps')||108),dailyTarget:Number(f.get('dailyTarget')||0),start:dateOrNull(f.get('start')),deadline:dateOrNull(f.get('deadline')),status:f.get('status'),defaultSession:f.get('session'),created:s?.created||new Date().toISOString()};
 if(s){Object.assign(s,obj);logEvent('sankalp_edit',s.id,`Sankalp updated: ${s.name}`)}else{data.sankalps.push(obj);logEvent('sankalp_create',obj.id,`Created Sankalp: ${obj.name}`)}
 closeModal();persist();toast(s?'Sankalp updated':'Sankalp created');};
}
function modalSession(prefillId=null){
 let opts=data.sankalps.filter(s=>['active','paused'].includes(s.status)).map(s=>`<option value="${s.id}" ${s.id===prefillId?'selected':''}>${esc(s.name)} — ${s.target} ${esc(s.unit)}</option>`).join('');
 document.getElementById('modalbox').innerHTML=`<div class="modalhead"><h2>Record Japa</h2><button class="x" onclick="closeModal()">×</button></div>${opts?`<form id="jform"><div class="formgrid">
 <div class="field full"><label>Sankalp *</label><select name="sankalpId" required>${opts}</select></div>

async function deleteSession(id){
 if(!confirm('Delete this Japa session? Sankalp progress will recalculate.'))return;
 let x=data.sessions.find(q=>q.id===id),s=data.sankalps.find(q=>q.id===x?.sankalpId);
 data.sessions=data.sessions.filter(q=>q.id!==id);
 if(s&&s.status==='completed'&&total(s)<s.target)s.status='active';
 logEvent('japa_delete',s?.id,`Deleted a Japa session from ${s?.name||'Sankalp'}`);
 persist();
 if(currentUser&&supabaseClient){try{await cloudDelete('sessions',id)}catch(e){console.error(e);toast('Local deletion saved; cloud deletion failed')}}
 toast('Session deleted');
}

async function deleteSankalp(id){
  const s=data.sankalps.find(x=>x.id===id);
  if(!s)return;
  const sessionCount=data.sessions.filter(x=>x.sankalpId===id).length;
  const milestoneCount=data.milestones.filter(x=>x.sankalpId===id).length;
  const eventCount=data.events.filter(x=>x.sankalpId===id).length;
  const ok=confirm(
    `Delete "${s.name}" permanently?\n\n`+
    `This will remove the Sankalp and its ${sessionCount} Japa session(s), `+
    `${milestoneCount} milestone(s), and ${eventCount} activity record(s).\n\n`+
    `This cannot be undone from SĀDHANA OS.`
  );
  if(!ok)return;

  // Delete from cloud first when connected. This avoids the background local->cloud
  // sync re-creating the record after the local deletion.
  if(currentUser&&supabaseClient){
    try{
      const {error}=await supabaseClient.from('sankalps')
        .delete()
        .eq('id',id)
        .eq('user_id',currentUser.id);
      if(error)throw error;
    }catch(e){
      alert('Sankalp was NOT deleted.\n\nCloud deletion failed: '+(e.message||e));
      return;
    }
  }

  data.sessions=data.sessions.filter(x=>x.sankalpId!==id);
  data.milestones=data.milestones.filter(x=>x.sankalpId!==id);
  data.events=data.events.filter(x=>x.sankalpId!==id);
  data.sankalps=data.sankalps.filter(x=>x.id!==id);
  selectedId=null;
  persist();
  showView('home');
  toast('Sankalp deleted');
}

function backupStats(obj){
  return {
    sankalps:Array.isArray(obj?.sankalps)?obj.sankalps:[],
    sessions:Array.isArray(obj?.sessions)?obj.sessions:[],
    milestones:Array.isArray(obj?.milestones)?obj.milestones:[],
    events:Array.isArray(obj?.events)?obj.events:[]
  };
}
function normalizeBackupObject(obj){
  const s=backupStats(obj);
  return {
    version:obj?.version||1,
    exportedAt:obj?.exportedAt||null,
    data:{
      sankalps:s.sankalps,
      sessions:s.sessions,
      milestones:s.milestones,
      events:s.events
    }
  };
}

function mergeUniqueById(current,incoming){
  const map=new Map((current||[]).map(x=>[String(x.id),x]));
  for(const x of (incoming||[])) map.set(String(x.id),x);
  return Array.from(map.values());
}
function importPendingBackup(mode){
  const pending=window._pendingBackup;
  if(!pending)return;
  const incoming=pending.data;
  if(mode==='replace'){
    if(!confirm('Replace the current browser data with this backup? The backup file will remain untouched, but the current browser data will be replaced.'))return;
    data={
      sankalps:incoming.sankalps.map(x=>({...x,deadline:dateOrNull(x.deadline)})),
      sessions:incoming.sessions.map(x=>({...x,date:dateOrNull(x.date)})),
      milestones:incoming.milestones,
      events:incoming.events
    };
  }else{
    data.sankalps=mergeUniqueById(data.sankalps,incoming.sankalps.map(x=>({...x,deadline:dateOrNull(x.deadline)})));
    data.sessions=mergeUniqueById(data.sessions,incoming.sessions.map(x=>({...x,date:dateOrNull(x.date)})));
    data.milestones=mergeUniqueById(data.milestones,incoming.milestones);
    data.events=mergeUniqueById(data.events,incoming.events);
  }
  persist();
  window._pendingBackup=null;
  render();
  renderBackup();
  toast(mode==='replace'?'Backup restored':'Backup merged successfully');
}
function clearPendingBackup(){

function generateRecoveryKey(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let raw='';
  if(window.crypto && crypto.getRandomValues){
    const bytes=new Uint8Array(12);
    crypto.getRandomValues(bytes);
    for(let i=0;i<bytes.length;i++) raw+=chars[bytes[i]%chars.length];
  }else{
    for(let i=0;i<12;i++) raw+=chars[Math.floor(Math.random()*chars.length)];
  }
  return raw.match(/.{1,4}/g).join('-');
}
function ensureRecoveryKey(){
  if(!settings.recoveryKey){

    localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));

}

async function cloudDelete(table,id){
 if(!currentUser||!supabaseClient)return;
 const {error}=await supabaseClient.from(table).delete().eq('id',id).eq('user_id',currentUser.id);
 if(error)throw error;
}
async function cloudPush(){
 if(!currentUser||!supabaseClient)return;
 const rows=rowsForCloud();
 const problems=validateCloudRows(rows);
 if(problems.length)throw new Error(problems.join(' '));
 for(const table of Object.keys(rows)){
   if(!rows[table].length)continue;
   const {error}=await supabaseClient.from(table).upsert(rows[table],{onConflict:'id'});
   if(error)throw new Error(`${table}: ${error.message}`);
 }
 localStorage.setItem('sadhana_os_last_sync',new Date().toISOString());
}

async function cloudPull(){
 if(!currentUser||!supabaseClient)return;
 for(const table of ['sankalps','sessions','milestones','events']){
  let {data:rows,error}=await supabaseClient.from(table).select('*').eq('user_id',currentUser.id).is('deleted_at',null);
  if(error)throw error;
  data[table]=rows.map(strip);
 }
 localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem('sadhana_os_last_sync',new Date().toISOString());render();
}

   }

 }catch(e){alert('Cloud sync failed: '+(e.message||e))}
}
function subscribeRealtime(){

 el.innerHTML=header('SYSTEM','Cloud Sync','One synchronized SĀDHANA OS database across your devices.','<button class="btn primary" onclick="syncNow()">↻ Sync Now</button>')+
 `<div class="cards">
 <div class="card"><h3 style="font:600 20px Georgia,serif">Connection</h3>
 <div class="cloudStatus"><span class="cloudDot ${currentUser?'ok':configured?'warn':''}"></span><b>${currentUser?'Connected':configured?'Configured — not signed in':'Not configured'}</b></div>
 <p class="muted" style="margin-top:10px">${currentUser?esc(currentUser.email):'Connect Supabase and sign in to synchronize.'}</p>
 ${currentUser?'<button class="btn" onclick="cloudSignOut()">Sign out</button>':'<button class="btn primary" onclick="openCloudSetup()">Configure / Sign in</button>'}</div>
 <div class="card"><h3 style="font:600 20px Georgia,serif">Synchronization</h3><p class="muted">Local data remains available offline. When connected, Sankalps, Japa sessions, milestones and events synchronize.</p>
 <p class="muted"><b>Last sync:</b> ${last?new Date(last).toLocaleString():'Never'}</p></div>
 <div class="card"><h3 style="font:600 20px Georgia,serif">Database</h3><p class="muted">Supabase PostgreSQL + Auth + Realtime with Row Level Security.</p><button class="btn" onclick="openCloudSetup()">Connection settings</button></div>
 <div class="card"><h3 style="font:600 20px Georgia,serif">Migration</h3><p class="muted">Upload the records already stored in this browser. Import your old JSON backup first if these records are not already here.</p><button class="btn primary" onclick="migrateLocalToCloud()">Upload local data</button></div></div>`;
}
function hasLocalRecords(){
 return data.sankalps.length>0 || data.sessions.length>0 || data.milestones.length>0 || data.events.length>0;
}
async function cloudHasRecords(){
 if(!currentUser||!supabaseClient)return false;
 for(const table of ['sankalps','sessions','milestones','events']){
  const {count,error}=await supabaseClient.from(table).select('id',{count:'exact',head:true}).eq('user_id',currentUser.id).is('deleted_at',null);
  if(error)throw error;
  if((count||0)>0)return true;
 }
 return false;
}
async function bootCloud(){
 if(!initSupabase())return;
 let {data:s}=await supabaseClient.auth.getSession();currentUser=s?.session?.user||null;
 if(currentUser){
  try{
   const cloudHas=await cloudHasRecords();
   if(!hasLocalRecords() || cloudHas){
     // Empty local device: pull the cloud database.
     // If both sides have records, keep the local copy until the user explicitly chooses
     // Upload local data or Sync Now, preventing accidental first-login overwrite.
     if(!hasLocalRecords()) await cloudPull();
     else renderCloud();
   }
   subscribeRealtime();
  }catch(e){console.error(e)}
 }
 supabaseClient.auth.onAuthStateChange(async(_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
   try{
    const cloudHas=await cloudHasRecords();
    if(!hasLocalRecords() && cloudHas) await cloudPull();
    subscribeRealtime();
   }catch(e){console.error(e)}
  }
  renderCloud();
 });
}

const localPersist=persist;
persist=function(){localPersist();if(currentUser&&supabaseClient)cloudPush().catch(e=>console.error('Background cloud sync failed',e))};
const localRender=render;
render=function(){localRender();renderCloud()};

render();setTimeout(lockIfNeeded,100);bootCloud();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));}</script></body>
